name: Deploy Doxygen docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOXYGEN_VERSION: 1.17.0
  DOXYGEN_SHA256: "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Doxygen
        run: |
          set -euxo pipefail

          VERSION="${DOXYGEN_VERSION}"
          TAG="Release_${VERSION//./_}"
          TARBALL="doxygen-${VERSION}.linux.bin.tar.gz"

          curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 120 \
            -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/${TAG}/${TARBALL}"

          echo "${DOXYGEN_SHA256}  doxygen.tar.gz" | sha256sum --check || { echo 'SHA256 verification failed'; exit 1; }

          tar -xzf doxygen.tar.gz

          sudo install -m 0755 "doxygen-${VERSION}/bin/doxygen" /usr/local/bin/doxygen

          doxygen --version

      - name: Build Doxygen
        run: |
          doxygen doc/Doxyfile
          test -f doc/html/index.html
          touch doc/html/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/html

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
