name: Deploy Doxygen docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOXYGEN_VERSION: 1.17.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Doxygen
        run: |
          set -euxo pipefail

          VERSION="${DOXYGEN_VERSION}"
          TAG="Release_${VERSION//./_}"
          TARBALL="doxygen-${VERSION}.linux.bin.tar.gz"

          curl -fsSL \
            -o doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/${TAG}/${TARBALL}"

          tar -xzf doxygen.tar.gz

          sudo install -m 0755 "doxygen-${VERSION}/bin/doxygen" /usr/local/bin/doxygen

          doxygen --version

      - name: Build Doxygen
        run: |
          doxygen doc/Doxyfile
          test -f doc/html/index.html
          touch doc/html/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/html

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
